<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Calculadora de Edad</title>

    <!-- Estilos propios -->
    <link rel='stylesheet' href='css/estilos.css'>
    <!-- Estilos del datepicker (copiados de node_modules a libs/ para GitHub Pages) -->
    <link rel='stylesheet' href='libs/datepicker.min.css'>
</head>

<body>
    <div class="Principal">
        <h1>Calculadora de Edad</h1>
        <h3>Introduzca su fecha de nacimiento:</h3>

        <!-- Ahora el botón es "submit" para que el formulario realmente se envíe -->
        <form id="FormularioEdad">
            <!-- readonly: el usuario solo puede elegir la fecha desde el datepicker -->
            <input class="Fecha" type="text" id="fechaNacimiento" placeholder="DD/MM/AAAA" readonly>
            <br>
            <button class="botonEnviar" type="submit">Calcular</button>
        </form>
        <br>
        <!-- Aquí se muestra el resultado (o el mensaje de error) -->
        <h3 id="ContenedorEdad">EDAD:</h3>
    </div>

    <!-- 1. El diccionario para Luxon (apunta a la copia en libs/) -->
    <script type="importmap">
    {
      "imports": {
        "luxon": "./libs/luxon.mjs"
      }
    }
    </script>

    <!-- 2. El datepicker se carga como script normal y crea la función global "datepicker" -->
    <script src="libs/datepicker.min.js"></script>

    <!-- 3. Nuestro script (type="module" porque importa Luxon) -->
    <script type="module" src="js/script.js"></script>
</body>
</html>
